function tvTool(){const P=TVX.P;if(!P||!MY.tool||TVX.toolCd>performance.now())return;TVX.toolCd=performance.now()+600;TVX.swing=performance.now();if(TVX.prac){for(const b of TVX.prac.bots){const dx=b.x-P.x,dz=b.z-P.z,d=Math.hypot(dx,dz);if(MY.tool=='bat'&&d<7.5){knock(b,dx/(d||1)*30,dz/(d||1)*30,70,3,10);fxHit(b.x,b.y+1,b.z)}}fxSwing(P);return}

 if(d.k=='bat'){fxSwing({x:d.x,y:d.y,z:d.z});for(const id of d.to||[]){const q=id==MY.id?TVX.P:TVX.rem[id];if(q)fxHit(q.x,q.y+1,q.z)}}
 else{for(const id of d.to||[]){const q=TVX.rem[id]||(id==MY.id?TVX.P:null);if(!q)continue;for(let k=0;k<=20;k++){const f=k/20;pAdd('sph',d.x+(q.x-d.x)*f,d.y+1+(q.y-d.y)*f,d.z+(q.z-d.z)*f,0,0,0,.35,.14,[.4,.95,1],{em:1.5,g:0})}fxHit(q.x,q.y+1,q.z)}}}
function tvTroll(d){if(!TVX.on)return;const P=TVX.P,n=Date.now(),ms=(d.secs||15)*1000;
 if(d.kind=='fling'&&P){const a=Math.random()*6.28;knock(P,Math.cos(a)*45,Math.sin(a)*45,26,2.5,12);tvBan('🌀 '+esc(d.from)+' flung you!',1500)}
 else if(d.kind=='freeze'){TVX.frz=n+ms;tvBan('🧊 Frozen!',1500)}else if(d.kind=='spin'){TVX.spin=n+ms;tvBan('😵 Dizzy!',1500)}else if(d.kind=='bouncy'){TVX.bouncy=n+ms;tvBan('🦘 Boing boing!',1500)}else if(d.kind=='unfx'){TVX.frz=TVX.spin=TVX.bouncy=0}}
function tvZap(d){if(!TVX.on||!TVX.P)return;const P=TVX.P;TVX.zapT=performance.now();for(let i=0;i<40;i++){const a=Math.random()*6.28,b=Math.random()*3;pAdd('sph',P.x,P.y+1,P.z,Math.cos(a)*b*3,Math.random()*8,Math.sin(a)*b*3,.8,.15,[.4,.95,1],{em:1.5})}
 const f=$('#tvflash');f.className='on';setTimeout(()=>f.className='',250);tvBan('⚡ Zapped by '+esc(d.from)+'!',1600);setTimeout(()=>{if(!TVX.P||!TVX.W)return;const W=TVX.W,sp=W.lobby?W.spawn():W.cpSpawn(P.cpz||0,0);const cz=P.cpz,w=P.w;Object.assign(P,mkBody(sp[0],sp[1]+.5,sp[2]));P.cpz=cz;P.w=w;TVX.resp=true;tvSendPos()},1100)}
function tvMoon(d){if(!TVX.on||!TVX.P||TVX.moon)return;const P=TVX.P;TVX.moon={t0:performance.now(),x:P.x,y:P.y,z:P.z,from:d.from||'Someone',w:{}};const e=$('#tvmoon');e.hidden=false;e.innerHTML=`<div class=mtxt>🚀 <b>${esc(TVX.moon.from)}</b> sent you to the MOON!</div>`}
function moonRender(t,now,dt){{const nc=$('#tvn');nc.getContext('2d').clearRect(0,0,nc.width,nc.height)}const M=TVX.moon,e=(now-M.t0)/1000,cv=GLX.cv,w=cv.clientWidth,h=cv.clientHeight;const space={sky:[[.01,.01,.06],[.08,.06,.2]],fog:[.05,.05,.12],sun:[1,1,.95],glow:1};const day=envOf(TVX.W.th);
 if(e>7.4){TVX.moon=null;$('#tvmoon').hidden=true;const P=TVX.P,W=TVX.W,sp=W.lobby?W.spawn():W.cpSpawn(P.cpz||0,0),cz=P.cpz,w2=P.w;Object.assign(P,mkBody(sp[0],sp[1]+.5,sp[2]));P.cpz=cz;P.w=w2;TVX.resp=true;tvSendPos();tvBan('🌍 Welcome back to Earth!',1600);return}
 const ch=(x,y,z,ry,sq,air)=>charDraw({x,y,z,ry,col:MY.color,eq:MY.eq,t,ph:TVX.ph,walk:false,sq,air,tilt:air?Math.sin(t*9)*.5:0,lean:air?-.4:0});
 if(e<2.2){const k=e/2.2,y=M.y+Math.pow(e,2.2)*40,env={sky:[day.sky[0].map((v,i)=>v*(1-k)+space.sky[0][i]*k),day.sky[1].map((v,i)=>v*(1-k)+space.sky[1][i]*k)],fog:day.fog,sun:day.sun,glow:k>.6?1:0};
  glFrame([M.x+6,M.y+3+y*.55,M.z-8],[M.x,M.y+y,M.z],env,w,h,t,{dpr:1,fogn:400,fogf:600});drawSky();ch(M.x,M.y+y,M.z,t*12,0,1);if(Math.random()<.8)pAdd('sph',M.x,M.y+y-.3,M.z,(Math.random()-.5)*2,-8,(Math.random()-.5)*2,.6,.25,[1,.7,.2],{em:1.4,g:0});partsDraw(t);partsUpd(dt);return}

 glDraw('sph',mTRS(30,26,60,0,t*.1,0,12,12,12),[.15,.4,.95],{pat:8,col2:[.2,.7,.3],em:.15,rim:.4});glDraw('cyl',mTRS(1.6,1.1,.4,0,0,0,.04,2.2,.04),[.9,.9,.9]);glDraw('box',mTRS(2.05,1.9,.4,0,Math.sin(t*2)*.1,0,.8,.5,.02),hx(MY.color),{em:.2});
 ch(0,fy,0,ca+Math.PI,M.w.sq||0,e<3.6);if(e>5.6){$('#tvmoon').innerHTML=`<div class=mtxt>🌙 Enjoy the view… returning to Earth!</div>`}partsUpd(dt);partsDraw(t)}
